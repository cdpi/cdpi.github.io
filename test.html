import { ThemeManager } from "cdn.jsdelivr.net/gh/cdpi/js/dist/css.js";

class App extends ThemeManager
	{
	constructor()
		{
		super();
		}

	onSystemThemeChange(isDarkMode)
		{
		document.body.style.backgroundColor = isDarkMode ? "#000" : "#fff";
		}
	}

</script>

</body>
